services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: kairos-platform-postgres
    environment:
      POSTGRES_USER: kairos_platform
      POSTGRES_PASSWORD: kairos_platform
      POSTGRES_DB: kairos_platform
    ports:
      - "5432:5432"
    volumes:
      - ../../sql/postgresql/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
      - kairos-platform-postgres:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: kairos-platform-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    container_name: kairos-platform-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    container_name: kairos-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kairos_platform
      MINIO_ROOT_PASSWORD: kairos_platform_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kairos-platform-minio:/data

  neo4j:
    image: neo4j:5.26.2
    container_name: kairos-platform-neo4j
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/kairos_platform
    volumes:
      - kairos-platform-neo4j:/data
    shm_size: 2g

  graphiti:
    image: vxcontrol/graphiti:latest
    container_name: kairos-platform-graphiti
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kairos_platform
      NEO4J_DATABASE: neo4j
      MODEL_NAME: ${GRAPHITI_MODEL_NAME:-qwen-plus}
      OPENAI_BASE_URL: ${OPEN_AI_SERVER_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_API_KEY: ${OPEN_AI_KEY:-}
      PORT: 8000

  # ── MCP: Headless Chromium with CDP endpoint ──────────────────────
  headless-chrome:
    image: chromedp/headless-shell:latest
    container_name: kairos-platform-headless-chrome
    ports:
      - "127.0.0.1:9222:9222"
    shm_size: 2gb

  # ── M2-F12: Distributed Pent Agent worker nodes ──────────────────
  # Database-less execution nodes. Gateway owns Run coordination and durable
  # state; agents receive desired state and publish audits through NATS.
  pent-agent-1:
    build:
      context: ../..
      dockerfile: apps/web/scripts/deploy/Dockerfile
    container_name: kairos-platform-pent-agent-1
    command: cargo run -p kairos-platform-pent-agent
    environment:
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      PENT_AGENT_PORT: "8081"
      PENTA_WORKER_ID: "node-1"
      RUST_LOG: info
    ports:
      - "8081:8081"
    restart: unless-stopped
    profiles:
      - distributed

  pent-agent-2:
    build:
      context: ../..
      dockerfile: apps/web/scripts/deploy/Dockerfile
    container_name: kairos-platform-pent-agent-2
    command: cargo run -p kairos-platform-pent-agent
    environment:
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      PENT_AGENT_PORT: "8082"
      PENTA_WORKER_ID: "node-2"
      RUST_LOG: info
    ports:
      - "8082:8082"
    restart: unless-stopped
    profiles:
      - distributed

  # ── Isolated red-team regression targets (loopback only) ─────────
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: kairos-lab-juice-shop
    ports:
      - "127.0.0.1:13000:3000"
    profiles:
      - red-team-labs

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: kairos-lab-dvwa
    ports:
      - "127.0.0.1:13001:80"
    profiles:
      - red-team-labs

  webgoat:
    image: webgoat/webgoat:latest
    container_name: kairos-lab-webgoat
    ports:
      - "127.0.0.1:13002:8080"
      - "127.0.0.1:13003:9090"
    profiles:
      - red-team-labs

volumes:
  kairos-platform-postgres:
  kairos-platform-minio:
  kairos-platform-neo4j:
  kairos-platform-chrome-data:
