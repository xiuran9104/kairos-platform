[workspace]
resolver = "3"
members = [
    "crates/framework/common",
    "crates/framework/database",
    "crates/framework/mq",
    "crates/framework/redis",
    "crates/framework/security",
    "crates/framework/telemetry",
    "crates/framework/tenant",
    "crates/framework/web",
    "crates/modules/infra-api",
    "crates/modules/infra-server",
    "crates/modules/ai-api",
    "crates/modules/ai-server",
    "crates/modules/media-api",
    "crates/modules/media-server",
    "crates/modules/system-api",
    "crates/modules/system-server",
    "crates/modules/toon-api",
    "crates/modules/toon-server",
    "crates/modules/pent-api",
    "crates/modules/pent-core",
    "crates/modules/pent-server",
    "crates/modules/scan-api",
    "crates/modules/scan-server",
    "services/gateway",
    "services/pent-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.com/kairos-platform"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
argon2 = "0.5"
base64 = "0.22"
bcrypt = "0.17"
axum = { version = "0.8", features = ["multipart"] }
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
ipnetwork = "0.20"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
redis = { version = "0.32", default-features = false, features = ["aio", "tokio-comp"] }
rust_xlsxwriter = "0.96"
kairos-platform-framework-common = { path = "crates/framework/common" }
kairos-platform-framework-database = { path = "crates/framework/database" }
kairos-platform-framework-mq = { path = "crates/framework/mq" }
kairos-platform-framework-redis = { path = "crates/framework/redis" }
kairos-platform-framework-security = { path = "crates/framework/security" }
kairos-platform-framework-telemetry = { path = "crates/framework/telemetry" }
kairos-platform-framework-tenant = { path = "crates/framework/tenant" }
kairos-platform-framework-web = { path = "crates/framework/web" }
kairos-platform-infra-api = { path = "crates/modules/infra-api" }
kairos-platform-infra-server = { path = "crates/modules/infra-server" }
kairos-platform-ai-api = { path = "crates/modules/ai-api" }
kairos-platform-ai-server = { path = "crates/modules/ai-server" }
kairos-platform-media-api = { path = "crates/modules/media-api" }
kairos-platform-media-server = { path = "crates/modules/media-server" }
kairos-platform-system-api = { path = "crates/modules/system-api" }
kairos-platform-system-server = { path = "crates/modules/system-server" }
kairos-platform-toon-api = { path = "crates/modules/toon-api" }
kairos-platform-toon-server = { path = "crates/modules/toon-server" }
kairos-platform-pent-api = { path = "crates/modules/pent-api" }
kairos-platform-pent-core = { path = "crates/modules/pent-core" }
kairos-platform-pent-server = { path = "crates/modules/pent-server" }
kairos-platform-scan-api = { path = "crates/modules/scan-api" }
kairos-platform-scan-server = { path = "crates/modules/scan-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
async-nats = "0.38"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["v4"] }
zip = "8.6"
