  - tool_id: web_wordpress_scan
    namespace: scanner
    name: WordPress 安全扫描
    description: 基于 WPScan 执行 WordPress 站点安全审计，检测插件/主题漏洞。
    capabilities: [web, wordpress, cms]
    tags: [wpscan, wordpress, cms, web]
    risk_level: medium
    supported_target_types: [url]
    input_schema:
      type: object
      required: [url]
      properties:
        url: {type: string, description: WordPress 站点 URL}
    output_schema:
      type: object
      properties:
        plugins: {type: array}
        version: {type: string}
        vulnerabilities: {type: array}
    executor:
      type: container
      program: /usr/bin/wpscan
      args: ["--url", "{{target}}", "--no-update", "--format", "json"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 600}
    embedding_document: WPScan WordPress 安全扫描器文档

  # ── 注入 ──────────────────────────────────────────────────────────────
  - tool_id: sqlmap
    namespace: web
    name: SQLMap
    description: 自动化 SQL 注入检测与利用。
    capabilities: [web, injection, sql]
    tags: [sqlmap, sqli]
    risk_level: high
    approval_policy: always
    supported_target_types: [url]
    input_schema:
      type: object
      required: [target]
