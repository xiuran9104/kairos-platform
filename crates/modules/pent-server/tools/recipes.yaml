      args: ["-u", "{{target}}", "-tags", "file-upload", "-jsonl", "-silent", "-rate-limit", "5", "-bulk-size", "1", "-no-interactsh"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 300}
    embedding_document: 文件上传验证

  - tool_id: afrog
    namespace: scanner
    name: Afrog
    description: Afrog 漏洞扫描器。
    capabilities: [web, vulnerability, scanning]
    tags: [afrog, vuln]
    risk_level: high
    supported_target_types: [url, hostname]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/local/bin/afrog
      args: ["-t", "{{target}}", "-json"]
    resource_profile: {cpu_cores: 1, memory_mb: 512, timeout_seconds: 600}
    embedding_document: Afrog 漏洞扫描器

  # ── 基础网络 ──────────────────────────────────────────────────────────
  - tool_id: dns_lookup
    namespace: network
    name: DNS 查询
    description: 使用 dig 查询目标 DNS 记录。
    capabilities: [network, dns, recon]
    tags: [dns, dig]
    risk_level: low
    supported_target_types: [hostname]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/dig
      args: ["+short", "{{target}}"]
    resource_profile: {cpu_cores: 0.1, memory_mb: 32, timeout_seconds: 30}
    embedding_document: DNS 查询

  - tool_id: ssh_exec
    namespace: network
    name: SSH 执行
    description: 对目标执行受限 SSH 命令（需审批）。
    capabilities: [network, ssh, execution]
    tags: [ssh, exec]
    risk_level: high
    approval_policy: always
    supported_target_types: [hostname, ipv4]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/ssh
      args: ["-o", "ConnectTimeout=5", "-o", "StrictHostKeyChecking=no", "{{target}}", "id; uptime; uname -a"]
    resource_profile: {cpu_cores: 0.2, memory_mb: 64, timeout_seconds: 60}
    embedding_document: SSH 执行

  - tool_id: sql_query
    namespace: network
    name: SQL 查询
    description: 对目标 PostgreSQL 执行受限查询。
    capabilities: [network, database]
    tags: [sql, psql]
    risk_level: medium
    supported_target_types: [hostname, ipv4]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/psql
      args: ["-h", "{{target}}", "-c", "SELECT version()"]
    resource_profile: {cpu_cores: 0.2, memory_mb: 64, timeout_seconds: 60}
    embedding_document: SQL 查询

  # ── 侦察 / 子域名 ──────────────────────────────────────────────────────
  - tool_id: subfinder
    namespace: recon
    name: Subfinder
    description: 被动子域名发现。
    capabilities: [osint, subdomain, passive]
    tags: [subfinder, subdomain, passive]
    risk_level: low
    supported_target_types: [hostname]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/subfinder
      args: ["-d", "{{target}}", "-silent"]
    resource_profile: {cpu_cores: 0.3, memory_mb: 128, timeout_seconds: 120}
    embedding_document: Subfinder 被动子域名发现

  - tool_id: amass
    namespace: recon
    name: Amass
    description: 子域名枚举和网络映射。
    capabilities: [osint, subdomain, enumeration]
    tags: [amass, subdomain, enumeration]
    risk_level: low
    supported_target_types: [hostname]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/amass
      args: ["enum", "-d", "{{target}}"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 300}
    embedding_document: Amass 子域名枚举

  - tool_id: dnsx
    namespace: recon
    name: DNSx
    description: 快速 DNS 工具包。
    capabilities: [dns, fast, toolkit]
    tags: [dnsx, dns, fast]
    risk_level: low
    supported_target_types: [hostname, ipv4]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/dnsx
      args: ["-d", "{{target}}", "-silent"]
    resource_profile: {cpu_cores: 0.3, memory_mb: 64, timeout_seconds: 60}
    embedding_document: DNSx 快速 DNS 工具包

  - tool_id: masscan
    namespace: recon
    name: Masscan
    description: 超高速端口扫描器。
    capabilities: [network, scanning, masscan]
    tags: [masscan, port-scan, fast]
    risk_level: medium
    supported_target_types: [ipv4, cidr]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
        rate: {type: integer}
    executor:
      type: container
      program: /usr/bin/masscan
      args: ["{{target}}", "-p", "1-65535", "--rate", "1000"]
    resource_profile: {cpu_cores: 2, memory_mb: 512, timeout_seconds: 300}
    embedding_document: Masscan 高速端口扫描

  - tool_id: naabu
    namespace: recon
    name: Naabu
    description: 快速端口扫描。
    capabilities: [network, scanning]
    tags: [naabu, port-scan]
    risk_level: medium
    supported_target_types: [hostname, ipv4]
    input_schema:
