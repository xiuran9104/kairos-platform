# Pent 工具配方清单。
#
# 本文件是 pent_tool_definitions 的编写格式；运行时不直接读取本文件，
# 由 `import_tool_recipes` 校验后 upsert 进数据库，gateway 启动时从数据库
# 加载到内存配方表。executor.program/args 直接驱动执行，但保留以下约束：
# 不使用 shell、program 必须在允许前缀内、目标仍受 Scope/NetworkPolicy 校验。
recipes:
  # ── 核心扫描 ──────────────────────────────────────────────────────────
  - tool_id: tcp_scan
    namespace: scanner
    name: TCP 端口扫描
    description: 基于 Nmap 执行 TCP 端口扫描与服务识别。
    capabilities: [network, scanning, service-discovery]
    tags: [nmap, port-scan, recon]
    risk_level: medium
    supported_target_types: [hostname, ipv4, ipv6, cidr]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string, description: 目标 IP 或主机名}
    executor:
      type: container
      program: /usr/bin/nmap
      args: ["-sT", "-Pn", "--reason", "--", "{{target}}"]
    resource_profile: {cpu_cores: 1, memory_mb: 256, timeout_seconds: 300}
    embedding_document: Nmap TCP 端口扫描与服务识别

  - tool_id: nmap
    namespace: scanner
    name: Nmap
    description: Nmap 端口扫描器。
    capabilities: [network, scanning]
    tags: [nmap, port-scan]
    risk_level: medium
    supported_target_types: [hostname, ipv4, ipv6, cidr]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/nmap
      args: ["-sT", "-Pn", "--reason", "--", "{{target}}"]
    resource_profile: {cpu_cores: 1, memory_mb: 256, timeout_seconds: 300}
    embedding_document: Nmap 端口扫描器

  - tool_id: nmap_scan
    namespace: scanner
    name: Nmap 端口扫描
    description: 基于 Nmap 执行 TCP/UDP 端口扫描与服务识别。支持自定义端口范围和扫描参数。
    capabilities: [network, scanning, service-discovery]
    tags: [nmap, port-scan, recon]
    risk_level: medium
    supported_target_types: [hostname, ipv4, ipv6, cidr]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string, description: 目标 IP 或主机名}
        ports: {type: string, description: 端口范围，如 80,443,8000-8100}
    output_schema:
      type: object
      properties:
        services: {type: array}
        open_ports: {type: array}
    executor:
      type: container
      program: /usr/bin/nmap
      args: ["-sT", "-Pn", "--reason", "--", "{{target}}"]
    resource_profile: {cpu_cores: 1, memory_mb: 256, timeout_seconds: 300}
    embedding_document: Nmap 网络扫描器安装及使用指南

  - tool_id: http_probe
    namespace: http
    name: HTTP 探测
    description: 使用 curl 对目标执行 HTTP/HTTPS 探测，返回状态行与响应头。
    capabilities: [http, web, recon]
    tags: [http, curl, probe]
    risk_level: low
    supported_target_types: [url, hostname, ipv4]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string, description: 目标 URL 或主机}
    executor:
      type: container
      program: /usr/bin/curl
      normalize_target: url_https
      args: ["--silent", "--show-error", "--insecure", "--dump-header", "-", "--max-redirs", "0", "--max-time", "30", "--url", "{{target}}"]
    resource_profile: {cpu_cores: 0.1, memory_mb: 32, timeout_seconds: 30}
    embedding_document: curl HTTP 探测工具

  - tool_id: http_request
    namespace: http
    name: HTTP 请求
    description: 在 Docker 隔离执行器中发送有状态 HTTP 请求，支持 Cookie Jar、CSRF Token、重定向和表单编码。
    capabilities: [http, request, web, stateful]
    tags: [http, request, curl, web, cookie, csrf]
    risk_level: low
    supported_target_types: [url, hostname, ipv4]
    input_schema:
      type: object
      required: [url]
      properties:
        url: {type: string}
        method: {type: string}
        body: {type: string}
        form: {type: object}
        headers: {type: object}
        csrf_header: {type: string}
    output_schema:
      type: object
      properties:
        status: {type: integer}
        raw_response: {type: string}
        csrf_token_captured: {type: boolean}
    executor:
      # 复杂有状态逻辑（headers/body/form/cookie）保留内置 handler，
      # 配方只提供元数据，不参与模板执行。
      type: builtin
    resource_profile: {cpu_cores: 0.1, memory_mb: 32, timeout_seconds: 30}
    embedding_document: curl HTTP 请求工具使用文档

  # ── 漏洞扫描 / 验证 ────────────────────────────────────────────────────
  - tool_id: nuclei
    namespace: scanner
    name: Nuclei
    description: 基于 Nuclei 的模板化漏洞扫描。
    capabilities: [web, vulnerability, scanning]
    tags: [nuclei, vuln, web]
    risk_level: high
    supported_target_types: [url, hostname, ipv4]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/nuclei
      args: ["-u", "{{target}}", "-jsonl", "-silent", "-no-interactsh"]
    resource_profile: {cpu_cores: 1, memory_mb: 512, timeout_seconds: 600}
    embedding_document: Nuclei 漏洞扫描器

  - tool_id: web_vuln_scan
    namespace: scanner
    name: Web 漏洞扫描
    description: 基于 Nuclei 执行 Web 应用漏洞扫描，支持自定义模板和严重级别过滤。
    capabilities: [web, vulnerability, scanning]
    tags: [nuclei, vuln, web, cve]
    risk_level: high
    supported_target_types: [url, hostname, ipv4]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string, description: 目标 URL 或主机}
        severity: {type: string, description: 严重级别过滤 low,medium,high,critical}
        templates: {type: string, description: Nuclei 模板路径或标签}
    output_schema:
      type: object
      properties:
        findings: {type: array}
        templates_used: {type: integer}
    executor:
      type: container
      program: /usr/bin/nuclei
      args: ["-u", "{{target}}", "-jsonl", "-silent", "-no-interactsh"]
    resource_profile: {cpu_cores: 1, memory_mb: 512, timeout_seconds: 600}
    embedding_document: Nuclei 漏洞扫描器使用指南

  - tool_id: sqli_validate
    namespace: scanner
    name: SQL 注入验证
    description: 使用 Nuclei sqli 标签模板验证 SQL 注入。
    capabilities: [web, injection, sql, validation]
    tags: [nuclei, sqli, validate]
    risk_level: high
    supported_target_types: [url]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/nuclei
      args: ["-u", "{{target}}", "-tags", "sqli", "-jsonl", "-silent", "-rate-limit", "5", "-bulk-size", "1", "-no-interactsh"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 300}
    embedding_document: SQL 注入验证

  - tool_id: xss_validate
    namespace: scanner
    name: XSS 验证
    description: 使用 Nuclei xss 标签模板验证跨站脚本。
    capabilities: [web, xss, validation]
    tags: [nuclei, xss, validate]
    risk_level: high
    supported_target_types: [url]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/nuclei
      args: ["-u", "{{target}}", "-tags", "xss", "-jsonl", "-silent", "-rate-limit", "5", "-bulk-size", "1", "-no-interactsh"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 300}
    embedding_document: XSS 验证

  - tool_id: csrf_validate
    namespace: scanner
    name: CSRF 验证
    description: 使用 Nuclei csrf 标签模板验证跨站请求伪造。
    capabilities: [web, csrf, validation]
    tags: [nuclei, csrf, validate]
    risk_level: high
    supported_target_types: [url]
