# Pent 工具配方清单。
# 由 import_tool_recipes 校验后 upsert 进 pent_tool_definitions。
recipes:
- tool_id: dns-enum
  version: 1.0.0
  manifest_version: 1
  namespace: recon
  name: Passive DNS Enumeration
  description: 使用 dnsx 对授权域名执行被动 DNS 记录枚举，替代 DesRedTeam 中仅适用于 Windows PowerShell 的实现。
  capabilities:
  - dns
  - recon
  - passive
  tags:
  - dnsx
  - dns
  - enumeration
  source: builtin
  risk_level: low
  approval_policy: conditional
  supported_target_types:
  - domain
  executor:
    type: host
    program: /usr/local/bin/dnsx
    args:
    - -silent
    - -json
  resource_profile:
    cpu_cores: 0.25
    memory_mb: 128
    timeout_seconds: 300
  embedding_document: Linux/Arch/Debian 通用的被动 DNS A、AAAA、CNAME、MX、NS、TXT、SOA、PTR 枚举。
  parameters:
  - name: domain
    type: string
    description: 已授权的域名
    required: true
    target: true
    position: 0
    format: positional
  - name: record_type
    type: string
    description: DNS 记录类型
    required: false
    options:
    - a
    - aaaa
    - cname
    - mx
    - ns
    - txt
    - soa
    - ptr
    template: -{value}
    format: template
  - name: resolver
    type: string
    description: 可选的 DNS Resolver
    required: false
    flag: -r
    format: flag
- tool_id: http-framework-test
  version: 1.0.0
  manifest_version: 1
  namespace: web
  name: Structured HTTP Framework Test
  description: 使用 curl 对授权 URL 执行结构化 HTTP 请求，支持常用方法、请求体、Header、Cookie、代理和 TLS 选项。
  capabilities:
  - web
  - http
  - api
  tags:
  - curl
  - http
  - request
  source: builtin
  risk_level: high
  approval_policy: always
  supported_target_types:
  - url
  executor:
    type: host
    program: /usr/bin/curl
    args:
    - --silent
    - --show-error
    - --max-filesize
    - '10485760'
  resource_profile:
    cpu_cores: 0.25
    memory_mb: 128
    timeout_seconds: 300
  embedding_document: 结构化 HTTP 和 API 测试工具，所有网络目标均经过当前 Run 授权范围校验。
  parameters:
  - name: url
    type: string
    description: 已授权的完整 URL
    required: true
    target: true
    position: 0
    format: positional
  - name: method
    type: string
    description: HTTP 方法
    required: false
    default: GET
    options:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - HEAD
    - OPTIONS
    flag: --request
    format: flag
  - name: data
    type: string
    description: 请求体
    required: false
    flag: --data
    format: flag
  - name: headers
    type: string
    description: 单个自定义 Header
    required: false
    flag: --header
    format: flag
  - name: cookies
    type: string
    description: Cookie 字符串
    required: false
    flag: --cookie
    format: flag
  - name: user_agent
    type: string
    description: User-Agent
    required: false
    flag: --user-agent
    format: flag
  - name: proxy
    type: string
    description: HTTP 或 SOCKS 代理
    required: false
    flag: --proxy
    format: flag
  - name: timeout
    type: int
    description: 请求超时秒数
    required: false
    default: 30
    flag: --max-time
    format: flag
  - name: include_headers
    type: bool
    description: 在输出中包含响应头
    required: false
    default: true
    flag: --include
    format: flag
  - name: follow_redirects
    type: bool
    description: 跟随重定向
    required: false
    default: false
    flag: --location
    format: flag
  - name: allow_insecure
    type: bool
    description: 允许无效 TLS 证书
    required: false
    default: false
    flag: --insecure
    format: flag
  - name: http2
    type: bool
    description: 使用 HTTP/2
    required: false
    default: false
    flag: --http2
    format: flag
- tool_id: scout-suite
  version: 1.0.0
  manifest_version: 1
  namespace: cloud
  name: Scout Suite Cloud Audit
  description: 使用租户绑定的临时凭据执行多云配置与安全最佳实践评估。
  capabilities:
  - cloud
  - compliance
  - configuration-audit
  tags:
  - scout-suite
  - aws
  - azure
  - aliyun
  source: builtin
  risk_level: high
  approval_policy: always
  supported_target_types:
  - cloud-account
  executor:
    type: host
    program: /usr/local/bin/scout
    args:
    - --report-dir
    - /artifacts
    - --no-browser
    target_type: file
  resource_profile:
    cpu_cores: 1.0
    memory_mb: 1024
    timeout_seconds: 1800
  embedding_document: Scout Suite AWS、Azure 与阿里云安全配置审计，报告写入 Run Artifact。
  parameters:
  - name: _credential_ref
    type: string
    description: 当前租户中已授权给 scout-suite 的不透明云凭据引用
    required: true
    runtime_only: true
  - name: provider
    type: string
    description: 云提供商
    required: true
    default: aws
    options:
    - aws
    - azure
    - aliyun
    position: 0
    format: positional
  - name: services
    type: string
    description: 可选的服务名称列表
    required: false
    flag: --services
    format: flag
