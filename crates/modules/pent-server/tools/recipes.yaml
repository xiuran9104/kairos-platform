    executor:
      type: container
      program: /usr/bin/nuclei
      args: ["-u", "{{target}}", "-tags", "lfi", "-jsonl", "-silent", "-rate-limit", "5", "-bulk-size", "1", "-no-interactsh"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 300}
    embedding_document: 文件包含验证

  - tool_id: file_upload_validate
    namespace: scanner
    name: 文件上传验证
    description: 使用 Nuclei file-upload 标签模板验证文件上传缺陷。
    capabilities: [web, upload, validation]
    tags: [nuclei, file-upload, validate]
    risk_level: high
    supported_target_types: [url]
    input_schema:
