      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/naabu
      args: ["-host", "{{target}}", "-silent"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 128, timeout_seconds: 120}
    embedding_document: Naabu 端口扫描

  # ── Web 发现 ──────────────────────────────────────────────────────────
  - tool_id: ffuf
    namespace: web
    name: ffuf
    description: Web 目录与参数 Fuzz。
    capabilities: [web, fuzzing, discovery]
    tags: [ffuf, fuzz]
    risk_level: medium
    supported_target_types: [url]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/ffuf
      args: ["-u", "{{target}}/FUZZ", "-w", "/usr/share/wordlists/dirb/common.txt", "-mc", "200,204,301,302,307,401,403,405,500"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 128, timeout_seconds: 600}
    embedding_document: ffuf 目录爆破

