      args: ["-u", "{{target}}", "-tags", "csrf", "-jsonl", "-silent", "-rate-limit", "5", "-bulk-size", "1", "-no-interactsh"]
    resource_profile: {cpu_cores: 0.5, memory_mb: 256, timeout_seconds: 300}
    embedding_document: CSRF 验证

  - tool_id: command_injection_validate
    namespace: scanner
    name: 命令注入验证
    description: 使用 Nuclei cmdi 标签模板验证命令注入。
    capabilities: [web, injection, validation]
    tags: [nuclei, cmdi, validate]
    risk_level: high
    supported_target_types: [url]
    input_schema:
      type: object
      required: [target]
      properties:
        target: {type: string}
    executor:
      type: container
      program: /usr/bin/nuclei
      args: ["-u", "{{target}}", "-tags", "cmdi", "-jsonl", "-silent", "-rate-limit", "5", "-bulk-size", "1", "-no-interactsh"]
